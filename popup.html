<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>BuzzerBeater 数据采集器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 480px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .header {
      background: linear-gradient(135deg, #16213e, #0f3460);
      padding: 16px 20px;
      border-bottom: 2px solid #e94560;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .header p {
      font-size: 12px;
      color: #a0a0b0;
      margin-top: 4px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 16px 20px;
    }
    .stat-card {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      border: 1px solid #2a2a4a;
    }
    .stat-card .value {
      font-size: 24px;
      font-weight: 700;
      color: #e94560;
    }
    .stat-card .label {
      font-size: 11px;
      color: #a0a0b0;
      margin-top: 4px;
    }
    .section {
      padding: 0 20px 16px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #a0a0b0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .player-list {
      max-height: 250px;
      overflow-y: auto;
      background: #16213e;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
    }
    .player-item {
      padding: 8px 12px;
      border-bottom: 1px solid #2a2a4a;
    }
    .player-item:last-child {
      border-bottom: none;
    }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .player-row + .player-row {
      margin-top: 2px;
    }
    .player-name {
      font-weight: 500;
      font-size: 13px;
    }
    .player-meta {
      font-size: 11px;
      color: #a0a0b0;
    }
    .player-id {
      font-size: 10px;
      color: #666;
    }
    .player-skills {
      font-size: 10px;
      color: #666;
      white-space: nowrap;
    }
    .actions {
      display: flex;
      gap: 8px;
      padding: 0 20px 16px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #e94560;
      color: #fff;
    }
    .btn-primary:hover {
      background: #c73652;
    }
    .btn-secondary {
      background: #2a2a4a;
      color: #e0e0e0;
    }
    .btn-secondary:hover {
      background: #3a3a5a;
    }
    .btn-danger {
      background: #3a1a1a;
      color: #ff6b6b;
    }
    .btn-danger:hover {
      background: #4a2a2a;
    }
    .status-bar {
      padding: 8px 20px;
      background: #0f1a2e;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: #666;
    }
    .empty-state .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #a0a0b0;
    }
    .position-tag {
      display: inline-block;
      background: #2a2a4a;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      margin-left: 6px;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1a1a2e;
    }
    ::-webkit-scrollbar-thumb {
      background: #3a3a5a;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>BuzzerBeater 数据采集器</h1>
    <p>球员数据自动采集与SQLite存储</p>
  </div>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="value" id="totalCount">-</div>
      <div class="label">球员总数</div>
    </div>
    <div class="stat-card">
      <div class="value" id="lastScrape">-</div>
      <div class="label">最近采集</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">最近采集的球员</div>
    <div class="player-list" id="playerList">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnRefresh">刷新</button>
    <button class="btn btn-secondary" id="btnExportJson">JSON</button>
    <button class="btn btn-secondary" id="btnExportSqlite">SQLite</button>
    <button class="btn btn-danger" id="btnClear">清空</button>
  </div>

  <div class="status-bar" id="statusBar">就绪</div>

  <script src="popup.js"></script>
</body>
</html>
